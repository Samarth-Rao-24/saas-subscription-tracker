{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
    <h2 class="mb-4">Edit Subscription</h2>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text"
                   name="name"
                   value="{{ sub.name }}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Price</label>
            <input type="number"
                   step="0.01"
                   name="price"
                   value="{{ sub.price }}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Billing Date</label>
            <input type="date"
                   name="billing_date"
                   value="{{ sub.billing_date.strftime('%Y-%m-%d') }}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Category</label>
            <select name="category" class="form-control">
                <option value="Entertainment" {% if sub.category == "Entertainment" %}selected{% endif %}>Entertainment</option>
                <option value="Software" {% if sub.category == "Software" %}selected{% endif %}>Software</option>
                <option value="Cloud" {% if sub.category == "Cloud" %}selected{% endif %}>Cloud</option>
                <option value="Music" {% if sub.category == "Music" %}selected{% endif %}>Music</option>
                <option value="Education" {% if sub.category == "Education" %}selected{% endif %}>Education</option>
                <option value="Fitness" {% if sub.category == "Fitness" %}selected{% endif %}>Fitness</option>
                <option value="Utilities" {% if sub.category == "Utilities" %}selected{% endif %}>Utilities</option>
                <option value="General" {% if sub.category == "General" %}selected{% endif %}>General</option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">
            Update Subscription
        </button>

    </form>
</div>

{% endblock %}
