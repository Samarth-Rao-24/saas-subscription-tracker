{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
    <h2>Edit Subscription</h2>

    <form method="POST">
        <div class="mb-3">
            <label>Name</label>
            <input type="text" name="name" value="{{ sub.name }}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Price</label>
            <input type="number" step="0.01" name="price" value="{{ sub.price }}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Billing Date</label>
            <input type="date" name="billing_date"
                   value="{{ sub.billing_date.strftime('%Y-%m-%d') }}"
                   class="form-control" required>
        </div>

        <button type="submit" class="btn btn-success">
            Update Subscription
        </button>
    </form>
</div>

{% endblock %}
